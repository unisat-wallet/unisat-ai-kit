name: CLI Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
            node-runtime: linux-x64-glibc-217
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-13
            target: macos-x64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.15.1

      - name: Setup CentOS 7 compatible Node.js
        if: matrix.node-runtime == 'linux-x64-glibc-217'
        run: |
          set -euo pipefail
          node_version="20.15.1"
          archive="node-v${node_version}-linux-x64-glibc-217.tar.xz"
          url="https://unofficial-builds.nodejs.org/download/release/v${node_version}/${archive}"
          mkdir -p .cache/node-runtime
          curl -fsSL "$url" -o ".cache/node-runtime/${archive}"
          tar -xJf ".cache/node-runtime/${archive}" -C .cache/node-runtime
          echo "$PWD/.cache/node-runtime/node-v${node_version}-linux-x64-glibc-217/bin" >> "$GITHUB_PATH"

      - name: Check Node.js
        run: node --version

      - name: Smoke test
        run: npm run smoke

      - name: Build single executable archive
        run: npm run package:cli -- --target ${{ matrix.target }}

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: unisat-cli-${{ matrix.target }}
          path: dist/single-cli/unisat-cli-${{ matrix.target }}/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd artifacts
          zip -qr ../release-assets/unisat-cli-windows-x64.zip unisat-cli-windows-x64
          tar -czf ../release-assets/unisat-cli-linux-x64.tar.gz unisat-cli-linux-x64
          tar -czf ../release-assets/unisat-cli-linux-arm64.tar.gz unisat-cli-linux-arm64
          tar -czf ../release-assets/unisat-cli-macos-x64.tar.gz unisat-cli-macos-x64
          tar -czf ../release-assets/unisat-cli-macos-arm64.tar.gz unisat-cli-macos-arm64
          cd ../release-assets
          sha256sum *.zip *.tar.gz > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/checksums.txt
