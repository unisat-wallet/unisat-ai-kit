name: CLI Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            archive: zip
          - os: ubuntu-latest
            target: linux-x64
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: linux-arm64
            archive: tar.gz
          - os: macos-15-intel
            target: macos-x64
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check Node.js
        run: npm run doctor

      - name: Smoke test
        run: npm run smoke

      - name: Build single executable archive
        run: npm run package:cli -- --target ${{ matrix.target }}

      - name: Build MCP portable archive
        run: npm run package:mcp:portable -- --target ${{ matrix.target }}

      - name: Upload executable archive
        uses: actions/upload-artifact@v4
        with:
          name: unisat-openapi-cli-${{ matrix.target }}
          path: dist/single-cli/unisat-openapi-cli-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload MCP portable archive
        uses: actions/upload-artifact@v4
        with:
          name: unisat-openapi-mcp-${{ matrix.target }}
          path: dist/portable-mcp/unisat-openapi-mcp-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum *.zip *.tar.gz > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/checksums.txt
